name: nfc_scan_demo
description: "NFC 商家優惠券示意 App：商家綁定 NFC 貼紙、使用者掃描貼紙查詢商家資訊與領取/核銷優惠券。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  nfc_manager: ^4.2.0
  http: ^1.2.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  uuid: ^4.6.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/nfc_uid_mapping.json
